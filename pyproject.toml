[project]
name = "eval-harness"
version = "0.1.0"
description = "Harness offline para avaliar sistemas com LLM: dataset, métricas, manifesto e relatório reproduzível."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
eval-harness = "eval_harness.cli:main"

[project.optional-dependencies]
openai = ["openai>=1.40"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eval_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = ["-q"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["eval_harness", "tests"]
